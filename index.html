<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SplitMetro">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Split Metronome</title>
<style>
:root{--bg:#111318;--card:#1b1f27;--btn:#2a2f3a;--fg:#e8eaf0;--mut:#8a90a0;--L:#ff9f43;--R:#3dd6f5;--acc:#5cff8a;--danger:#ff5c5c;--P:#b48cff;--G:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:520px;margin:0 auto;padding:8px 12px 30px;display:grid;gap:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px}
h1{font-size:16px;margin:0;white-space:nowrap}
#songName{color:var(--mut);font-size:13px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdBtn{display:none}
.leftCol{display:contents}
.slotBtns{display:flex;gap:6px;margin-top:6px}
.slotBtns button{flex:1;height:32px;padding:0 8px;font-size:13px;border-radius:8px}
.slotBtns .hdDel{flex:0 0 40px}
.assignBtn{color:var(--mut)}
.assignBtn.on{background:var(--acc);color:#000;font-weight:700}
.slotsCard{position:relative;padding:8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.slots button{height:38px;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;min-width:0}
.slots button .n{font-size:13px;font-weight:700}
.slots button .s{font-size:9px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots button.empty .n{color:var(--mut);font-weight:400}
.slots button.cur{background:var(--acc);color:#000} .slots button.cur .s{color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.modalBox{background:var(--card);border-radius:16px;width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modalHead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #262b35}
.modalHead .ttl{color:var(--acc);font-size:15px}
.modalTip{flex:1;font-size:11px;color:var(--mut);min-width:0}
.modalClose{height:32px;width:36px;padding:0;font-size:18px;border-radius:9px;color:var(--mut)}
.modalBody{overflow:auto;padding:6px 12px 10px}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #262b35}
.srow:first-child{border-top:0}
.srow .sname{flex:1;min-width:0;height:40px;text-align:left;padding:0 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;line-height:1.1}
.srow .sname b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sname small{font-size:11px;color:var(--mut)}
.srow .sname.cur{background:var(--acc);color:#000} .srow .sname.cur small{color:#000}
.sslots{display:flex;gap:4px;flex:none}
.sslots button{width:32px;height:32px;padding:0;font-size:13px;border-radius:8px;font-weight:700}
.sslots button.in{background:var(--acc);color:#000}
.srow .sdel{width:32px;height:32px;padding:0;font-size:16px;border-radius:8px;color:var(--mut);flex:none}
.modalEmpty{color:var(--mut);font-size:13px;padding:14px 4px;text-align:center}
.modalHead{flex-wrap:wrap}
.mbtns{display:flex;gap:6px}
.mbtn{height:30px;padding:0 12px;font-size:13px;border-radius:8px;font-weight:600}
.modal.share{background:rgba(0,0,0,.88);padding:10px;z-index:30}
.shareBox{background:#fff;color:#000;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;max-height:100%}
#shareQr{display:block;image-rendering:pixelated;flex:none}
.shareSide{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.shareInfo{display:flex;flex-direction:column;gap:3px;text-align:center}
.shareInfo b{font-size:16px} .shareInfo span{font-size:13px;color:#555;min-height:16px} .shareInfo small{font-size:11px;color:#777;line-height:1.3}
.shareBtns{display:flex;gap:6px;justify-content:center}
.shareBtns button{height:36px;padding:0 14px;font-size:14px;background:#e9ebf0;color:#000;border-radius:9px}
.shareBtns button.primary{background:var(--acc);font-weight:700}
#sharePrev,#shareNext{width:44px;padding:0;font-size:22px}
.shareBox.one #sharePrev,.shareBox.one #shareNext{display:none}
.modal.scan{padding:0}
.scanBox{position:relative;width:100%;height:100%;background:#000;overflow:hidden}
#scanVideo{width:100%;height:100%;object-fit:cover;display:block}
.scanFrame{position:absolute;left:50%;top:50%;width:min(60vw,60vh);height:min(60vw,60vh);transform:translate(-50%,-50%);border:3px solid rgba(92,255,138,.9);border-radius:14px;pointer-events:none}
.scanBar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(0,0,0,.55)}
.scanStatus{flex:1;font-size:13px;color:#fff;min-width:0}
.scanBar button{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
@media (min-width:640px) and (orientation:landscape){
  .shareBox{flex-direction:row;align-items:center;gap:14px}
  .shareSide{width:200px}
}
.card{background:var(--card);border-radius:14px;padding:12px}
button{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:10px;padding:0 12px;height:44px;font-size:16px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97);filter:brightness(1.25)}
select{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:10px;height:36px;padding:0 10px;font-size:14px;width:100%}
.bpmRow{display:flex;align-items:center;justify-content:center;gap:10px}
.bpmNum{font-size:56px;font-weight:700;line-height:1;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.bpmNum small{font-size:11px;color:var(--mut);display:block;font-weight:400;letter-spacing:1px;margin-top:2px}
.round{width:44px;height:44px;border-radius:50%;font-size:24px;padding:0;flex:none}
input[type=range]{width:100%;margin:8px 0 2px;accent-color:var(--acc);height:24px}
.go{display:flex;gap:8px;margin-top:8px}
.tap{flex:1;height:54px;font-size:17px;font-weight:700;background:#353c4b}
.tap.hit{background:var(--acc);color:#000}
.tap .short{display:none}
.start{flex:1;height:54px;font-size:20px;font-weight:700;background:var(--acc);color:#000;letter-spacing:1px}
.start.running{background:var(--danger);color:#fff}
.meter{display:flex;flex-direction:column;gap:8px}
.meterRow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lights{display:flex;gap:8px;flex:1 1 auto;flex-wrap:nowrap}
.light{width:32px;height:32px;border-radius:50%;border:2px solid #3a4150;background:transparent;padding:0;transition:transform .05s;position:relative}
.lights.six{gap:5px} .lights.six .light{width:26px;height:26px}
.lights.six .light.a0::after{left:5px;right:5px}
.light.a1{background:#5a6478;border-color:#5a6478}
.light.a2{background:var(--acc);border-color:var(--acc)}
.light.a0::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:2px;background:#3a4150;transform:rotate(-45deg)}
.light.on{transform:scale(1.18);box-shadow:0 0 0 3px var(--fg)}
.legend{font-size:10px;color:var(--mut);line-height:1.4;text-align:right;max-width:104px;min-width:0}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin:0 2px 0 5px}
.sig{display:flex;gap:6px;flex:none}
.sig button{height:38px;padding:0 12px;font-size:15px;font-weight:600}
.sig button.sel{background:var(--acc);color:#000}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--card);border-radius:14px;padding:10px}
.side h2{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.side.left h2{color:var(--L)} .side.right h2{color:var(--R)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--btn);display:inline-block;flex:none}
.dot.on{animation:flash .18s ease-out}
.dot.sub{animation:flashSub .12s ease-out}
@keyframes flash{0%{transform:scale(1.6);background:currentColor}100%{transform:scale(1);background:var(--btn)}}
@keyframes flashSub{0%{transform:scale(1.15);background:currentColor;opacity:.6}100%{transform:scale(1);background:var(--btn)}}
.mute{height:26px;padding:0 8px;font-size:11px;border-radius:7px;color:var(--mut)}
.mute.on{background:var(--danger);color:#fff}
.hbtns{display:flex;gap:4px;align-items:center}
.gear{height:26px;width:30px;padding:0;font-size:16px;border-radius:7px;color:var(--mut)}
.gear.open{background:var(--fg);color:#000}
.side{position:relative}
.sndPop{position:absolute;right:10px;top:40px;z-index:5;background:#262b35;border-radius:10px;padding:6px;display:grid;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.sndPop[hidden]{display:none}
.sndPop button{height:36px;font-size:14px;padding:0 16px;text-align:left;min-width:120px}
.side.left .sndPop button.sel{background:var(--L);color:#000;font-weight:700}
.side.right .sndPop button.sel{background:var(--R);color:#000;font-weight:700}
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.subs button{height:44px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.subs button .g{font-size:20px;line-height:1}
.subs button .t{font-size:10px;color:var(--mut);line-height:1}
.subs button.sel{color:#000;font-weight:700}
.subs button.sel .t{color:#000}
.side.left .subs button.sel{background:var(--L)} .side.right .subs button.sel{background:var(--R)}
.vrow{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--mut)}
.vrow input[type=range]{flex:1;margin:0;height:22px}
.vrow b{min-width:22px;text-align:right;font-weight:400}
.cardHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.ttl{font-weight:700;font-size:14px}
.padCard .ttl{color:var(--P)} .guideCard .ttl{color:var(--G)}
.status{font-size:12px;color:var(--mut);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.padCard .status b{color:var(--P)} .guideCard .status b{color:var(--G)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.keys button{height:38px;font-size:15px;padding:0}
.keys button.sel{background:var(--P);color:#000;font-weight:700}
.padCard .vrow input{accent-color:var(--P)}
.addSec{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.addSec button{height:38px;font-size:13px;padding:0 3px;background:#333a48;color:#fff;font-weight:600}
.addSec button.pending{background:var(--G);color:#000;font-weight:700}
.addSec button.fired{background:#8a6d1f;color:#000}
.guideCard .vrow input{accent-color:var(--G)}
.gopts{gap:4px} .gopts button{height:26px;padding:0 8px;font-size:11px;font-weight:600;border-radius:8px}
.gopts button.sel{background:var(--G);color:#000}
.saveRow{display:flex;gap:8px}
.saveRow input{flex:1;font:inherit;font-size:16px;color:var(--fg);background:var(--btn);border:0;border-radius:10px;padding:0 12px;height:44px;min-width:0}
.saveRow input::placeholder{color:var(--mut)}
#songs{list-style:none;margin:8px 0 0;padding:0}
#songs li{display:flex;align-items:center;gap:8px;padding:8px 4px;border-top:1px solid #262b35}
#songs li .info{flex:1;min-width:0}
#songs li .nm{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#songs li .meta{font-size:12px;color:var(--mut);margin-top:2px}
#songs li .meta b{font-weight:600}
#songs li .meta .l{color:var(--L)} #songs li .meta .r{color:var(--R)}
#songs li.cur .nm{color:var(--acc)}
.del{height:32px;width:32px;padding:0;border-radius:9px;color:var(--mut);font-size:16px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:10px 0 2px}
.hint{color:var(--mut);font-size:11px;text-align:center;line-height:1.5}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* landscape: everything important on one screen, three columns */
@media (min-width:640px) and (orientation:landscape){
  .wrap{max-width:none;padding:6px 8px;height:100vh;height:100dvh;box-sizing:border-box;grid-template-columns:0.9fr 1.3fr 1.15fr;
    grid-template-rows:auto minmax(0,1fr);gap:6px;align-items:stretch;
    grid-template-areas:"left sides guide" "left pad guide"}
  .leftCol{display:flex;flex-direction:column;gap:6px;grid-area:left;min-height:0}
  .bpmCard,.meter{flex:none} .slotsCard{flex:1;min-height:0}
  .slotsCard,.padCard,.guideCard,.bpmCard{display:flex;flex-direction:column;min-height:0}
  .bpmCard{justify-content:center;padding:8px 10px}
  .bpmNum{font-size:38px;min-width:86px} .round{width:36px;height:36px;font-size:19px}
  .bpmCard input[type=range]{height:20px} .tap,.start{height:42px;font-size:16px}
  .slots button{min-height:26px} .slots button .s{font-size:8.5px}
  .cardHead,.vrow,.slotBtns{flex:none}
  .slots{flex:1;grid-auto-rows:1fr;min-height:0} .slots button{height:auto;min-height:30px}
  .keys{flex:1;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;min-height:0;gap:6px} .keys button{height:auto;min-height:28px}
  .addSec{flex:1;grid-auto-rows:1fr;min-height:0} .addSec button{height:auto;min-height:36px}
  header{display:none}
  .meter{gap:6px} .light{width:28px;height:28px} .lights{gap:6px;justify-content:space-between} .lights.six .light{width:24px;height:24px}
  .light.a0::after{left:6px;right:6px}
  .meter .sig{flex:1 1 auto;width:100%} .meter .sig button{flex:1;height:32px;padding:0;font-size:13px}
  .bpmCard input[type=range]{margin:2px 0 0} .go{margin-top:4px}
  .slots button{min-height:30px}
  .sides{grid-area:sides;grid-template-columns:1fr;gap:6px}
  .padCard{grid-area:pad} .guideCard{grid-area:guide} .songsCard{display:none} .hint{display:none}
  .card,.side{padding:8px 10px;border-radius:12px}
  .side{padding:6px 8px}
  .sideRow{display:flex;gap:8px;align-items:center}
  .sideRow .subs{flex:0 0 auto;width:150px}
  .sideRow .vrow{flex:1;margin-top:0;min-width:0}
  .sideRow .vrow span{display:none}
  .sndPop{top:34px}
  .bpmNum{font-size:40px;min-width:90px} .bpmNum small{font-size:10px;margin-top:0}
  .round{width:38px;height:38px;font-size:20px}
  input[type=range]{margin:4px 0 0;height:22px}
  .go{margin-top:6px} .tap,.start{height:44px;font-size:17px;white-space:nowrap}
  .tap .full{display:none} .tap .short{display:inline}
  .legend{display:none}
  .side h2{margin-bottom:5px} .subs button{height:40px} .side{padding:7px 8px}
  .keys button{font-size:14px}
  .addSec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px} .addSec button{font-size:13px;padding:0 4px;white-space:nowrap}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .songsCard{display:none}
  .hdBtn{display:block}
  .hdDel{color:var(--mut)}
  .slotBtns{margin-top:4px} .slotBtns button{height:28px}
  .slotsCard{padding:6px 8px}
  .cardHead{margin-bottom:6px}
  #songName{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Split Metronome</h1><span id="songName">unsaved</span></header>

  <div class="leftCol">
  <div class="card bpmCard">
    <div class="bpmRow">
      <button class="round" id="bpmDown" aria-label="slower">&minus;</button>
      <div class="bpmNum"><span id="bpmVal">120</span><small id="bpmUnit">BPM  ♩</small></div>
      <button class="round" id="bpmUp" aria-label="faster">+</button>
    </div>
    <input type="range" id="bpmSlider" min="30" max="300" value="120">
    <div class="go">
      <button class="tap" id="tapBtn"><span class="full">TAP TEMPO</span><span class="short">TAP</span></button>
      <button class="start" id="startBtn">START</button>
    </div>
  </div>

  <div class="card meter">
    <div class="meterRow">
      <div class="lights" id="lights"></div>
      <div class="legend">tap a beat<br><span><i style="background:var(--acc)"></i>accent</span> <span><i style="background:#5a6478"></i>normal</span> <span><i style="border:2px solid #3a4150;width:5px;height:5px"></i>silent</span></div>
    </div>
    <div class="meterRow">
      <div class="sig" id="sig"></div>
    </div>
  </div>

  <div class="card slotsCard">
    <div class="slots" id="slots"></div>
    <div class="slotBtns"><button class="assignBtn" id="hdAssign">assign</button><button class="hdBtn" id="hdSave">Save</button><button class="hdBtn hdDel" id="hdDel" aria-label="delete song">&times;</button></div>
  </div>
  </div>

  <div class="sides">
    <div class="side left">
      <h2><span>LEFT</span><span class="dot" id="dotL"></span><span class="hbtns"><button class="mute" id="muteL">MUTE</button><button class="gear" id="gearL" aria-label="left sound">&#9881;</button></span></h2>
      <div class="sndPop" id="sndL" hidden></div>
      <div class="sideRow">
        <div class="subs" id="subsL"></div>
        <div class="vrow"><span>vol</span><input type="range" id="volL" min="0" max="100" value="80"><b id="volLv">80</b></div>
      </div>
    </div>
    <div class="side right">
      <h2><span>RIGHT</span><span class="dot" id="dotR"></span><span class="hbtns"><button class="mute" id="muteR">MUTE</button><button class="gear" id="gearR" aria-label="right sound">&#9881;</button></span></h2>
      <div class="sndPop" id="sndR" hidden></div>
      <div class="sideRow">
        <div class="subs" id="subsR"></div>
        <div class="vrow"><span>vol</span><input type="range" id="volR" min="0" max="100" value="80"><b id="volRv">80</b></div>
      </div>
    </div>
  </div>

  <div class="card padCard">
    <div class="cardHead"><span class="ttl">PAD</span><span class="status" id="padStatus">tap a key</span></div>
    <div class="keys" id="keys"></div>
    <div class="vrow"><span>vol</span><input type="range" id="padVol" min="0" max="100" value="50"><b id="padVolV">50</b></div>
  </div>

  <div class="card guideCard">
    <div class="cardHead"><span class="ttl">GUIDE</span><div class="sig modes gopts"><button id="gCount">count</button><button id="gCountIn">guide</button></div><span class="status" id="gStatus"></span></div>
    <div class="addSec" id="addSec"></div>
    <div class="vrow"><span>vol</span><input type="range" id="guideVol" min="0" max="100" value="80"><b id="guideVolV">80</b></div>
  </div>

  <div class="card songsCard">
    <div class="saveRow">
      <input id="nameIn" placeholder="song name" maxlength="40" autocomplete="off">
      <button id="saveBtn">Save</button>
    </div>
    <ul id="songs"></ul>
  </div>

</div>
<div id="toast"></div>
<div class="modal" id="songModal" hidden>
  <div class="modalBox">
    <div class="modalHead"><span class="ttl">Saved songs</span><span class="mbtns"><button class="mbtn" id="songSend">Send</button><button class="mbtn" id="songRecv">Receive</button></span><span class="modalTip">number = slot, name = load</span><button class="modalClose" id="modalClose" aria-label="close">&times;</button></div>
    <div class="modalBody" id="songRows"></div>
  </div>
</div>
<div class="modal share" id="shareModal" hidden>
  <div class="shareBox">
    <canvas id="shareQr" width="10" height="10"></canvas>
    <div class="shareSide">
      <div class="shareInfo"><b id="shareTitle">Songs</b><span id="sharePage"></span><small>On the other phone: assign, Receive, point its camera here.</small></div>

<script src="guide-voices.js?v=4"></script>

<script src="jsQR.js"></script>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var NOTES = [ {id:'q', glyph:'♩', label:'1/4'}, {id:'e', glyph:'♪', label:'1/8'}, {id:'s', glyph:'♬', label:'1/16'} ];
var SIGS = ['3/4','4/4','6/8'];
var SOUNDS = [ {id:'beep',label:'Beep'}, {id:'wood',label:'Wood'}, {id:'tick',label:'Tick'}, {id:'snap',label:'Snap'} ];
var KEYS = ['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
var STATE_KEY = 'splitmetro.state', SONGS_KEY = 'splitmetro.songs';

var S = { bpm:120, sig:'4/4', accents:defaultAccents(),
  left:{note:'q', vol:80, mute:false, sound:'beep'}, right:{note:'e', vol:80, mute:false, sound:'beep'},
  pad:{on:false, key:0, mode:'major', vol:50},
  guide:{vol:80, count:true, countTo:'bar', countIn:true} };
var songName = '';

var SECTIONS = [['intro','Intro'],['verse','Verse'],['prechorus','Pre-Chorus'],['chorus','Chorus'],['bridge','Bridge'],['tag','Tag'],
  ['buildup','Build-up'],['allin','All-in'],['break','Break'],['drumonly','Drum only'],['voiceonly','Voice only'],
  ['interlude','Interlude'],['instrumental','Instrumental'],['outro','Outro'],['count','Count']];
function secInfo(id){ for(var i=0;i<SECTIONS.length;i++) if(SECTIONS[i][0]===id) return SECTIONS[i]; return SECTIONS[1]; }
function normGuide(g){ g=g||{}; return { vol:Math.max(0,Math.min(100, g.vol===undefined ? 80 : (+g.vol||0))), count: g.count!==false, countTo: g.countTo==='4' ? '4' : 'bar', countIn: g.countIn!==false }; }
function normPad(p){
  var o = Object.assign({on:false, key:0, mode:'major', vol:50}, p||{});
  o.key = Math.max(0, Math.min(11, +o.key||0)); o.mode = 'major';
  o.vol = Math.max(0, Math.min(100, +o.vol||0)); o.on = !!o.on; return o;
}

/* per-beat accent pattern for each time signature: 2 = accent, 1 = normal, 0 = silent */
function defaultAccents(){ return { '3/4':[2,1,1], '4/4':[2,1,1,1], '6/8':[2,1,1,1,1,1] }; }   /* 6/8: strong 1, normal 4 */
function normAccents(a){
  var d = defaultAccents();
  if(a && typeof a==='object') for(var k in d) if(Array.isArray(a[k])) d[k] = d[k].map(function(v,i){ var x=a[k][i]; return (x===0||x===1||x===2) ? x : v; });
  return d;
}
function accentOf(beat){ var p=S.accents[S.sig]; return p && p[beat]!==undefined ? p[beat] : 1; }

/* The bar is a grid of counts. BPM is always the quarter note (DAW style).
   3/4 and 4/4: count = quarter. 6/8: count = eighth (6 lights), so a count is half a BPM beat
   and the two main beats (counts 1 and 4) are dotted quarters. */
function beatsPerBar(){ return S.sig==='3/4' ? 3 : (S.sig==='6/8' ? 6 : 4); }
function countLen(){ var b=60/S.bpm; return S.sig==='6/8' ? b/2 : b; }
/* counts that get a spoken number: every count (MultiTracks counts all six eighths in 6/8) */
function countPositions(){ var n=beatsPerBar(), a=[]; for(var i=0;i<n;i++) a.push(i); return a; }
/* for a section call: "to 4" stops early in 6/8 to leave room for a sung pickup on 5 and 6 */
function callPositions(){ var p=countPositions(); return (S.guide.countTo==='4' && p.length>4) ? p.slice(0,4) : p; }
/* clicks inside one count for a note value; 0 = no click on this count */
function clicksPer(note, count){
  if(S.sig==='6/8'){
    if(note==='q') return count%3===0 ? 1 : 0;   /* main beat: counts 1 and 4 */
    return note==='s' ? 2 : 1;
  }
  return note==='s' ? 4 : (note==='e' ? 2 : 1);
}
/* accept old saves that stored a number in .sub */
function normSide(x, def){
  x = x||{};
  var note = x.note;
  if(!note){ var n=+x.sub; note = n>=4 ? 's' : (n>=2 ? 'e' : (n>=1 ? 'q' : def)); }
  var o = Object.assign({vol:80, mute:false, sound:'beep'}, x, {note:note});
  if(!SOUNDS.some(function(s){ return s.id===o.sound; })) o.sound='beep';
  delete o.sub; return o;
}
function normSig(sg){ if(sg.sig) return sg.sig; var b=sg.beatsPerBar; return b===3 ? '3/4' : (b===6 ? '6/8' : '4/4'); }

/* ---------- audio ---------- */
var ctx=null, gainL, gainR, outMerger;
var running=false, nextBeatTime=0, beatInBar=0, barIndex=0, timerId=null;
var LOOKAHEAD=0.15, INTERVAL=25;
var queue=[];
var FREQ = { left:[1900,1450,1100], right:[1150,850,650] };   /* [bar accent, beat, subdivision] */

function ensureAudio(){
  if(!ctx){
    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({latencyHint:'interactive'});
    outMerger = ctx.createChannelMerger(2);
    outMerger.connect(ctx.destination);
    gainL = ctx.createGain(); gainR = ctx.createGain();
    gainL.connect(outMerger,0,0);   /* hard left */
    gainR.connect(outMerger,0,1);   /* hard right */
    applyVolumes();
    ensureGuide();
  }
  if(ctx.state==='suspended') ctx.resume();
}
function applyVolumes(){
  if(!ctx) return;
  gainL.gain.value = S.left.mute ? 0 : S.left.vol/100;
  gainR.gain.value = S.right.mute ? 0 : S.right.vol/100;
}
var noiseBuf=null;
function noise(){
  if(!noiseBuf){
    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.3), ctx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  var s = ctx.createBufferSource(); s.buffer = noiseBuf; return s;
}
function env(g, time, amp, attack, dur){
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(amp, time+attack);
  g.gain.exponentialRampToValueAtTime(0.0001, time+dur);
}
/* level: 0 = accent, 1 = normal beat, 2 = subdivision */
function click(side, time, level){
  var out = side==='left' ? gainL : gainR;
  var f = FREQ[side][level];
  var amp = level===0 ? 1.0 : (level===1 ? 0.8 : 0.42);
  var snd = S[side].sound || 'beep';
  var g = ctx.createGain(); g.connect(out);
  var o, n, dur, flt;
  if(snd==='wood'){
    dur = level===2 ? 0.03 : 0.05;
    o = ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(f*0.9, time);
    o.frequency.exponentialRampToValueAtTime(f*0.55, time+dur);
    env(g, time, Math.min(1, amp*1.2), 0.001, dur);
    o.connect(g); o.start(time); o.stop(time+dur+0.02);
    n = noise(); flt = ctx.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=f*2; flt.Q.value=2;
    var ng = ctx.createGain(); env(ng, time, amp*0.5, 0.001, 0.015);
    n.connect(flt); flt.connect(ng); ng.connect(out); n.start(time); n.stop(time+0.03);
  } else if(snd==='tick'){
    dur = level===2 ? 0.008 : 0.014;
    o = ctx.createOscillator(); o.type='square'; o.frequency.value=f;
    env(g, time, amp*0.5, 0.0005, dur);
    o.connect(g); o.start(time); o.stop(time+dur+0.01);
  } else if(snd==='snap'){
    dur = level===2 ? 0.02 : 0.04;
    n = noise(); flt = ctx.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=f*2.5; flt.Q.value=1.2;
    env(g, time, amp*0.9, 0.001, dur);
    n.connect(flt); flt.connect(g); n.start(time); n.stop(time+dur+0.02);
  } else {  /* beep */
    dur = level===2 ? 0.035 : 0.06;
    o = ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    env(g, time, amp, 0.0015, dur);
    o.connect(g); o.start(time); o.stop(time+dur+0.02);
  }
}
function preview(side){
  ensureAudio();
  click(side, ctx.currentTime + 0.02, 1);
}

/* ---------- guide voice ---------- */
var guideGain=null, guideSide={left:null, right:null}, guideBuf={}, guideLoad={};
function ensureGuide(){
  if(guideGain) return;
  guideGain = ctx.createGain(); guideGain.gain.value = S.guide.vol/100; guideGain.connect(ctx.destination);
  ['left','right'].forEach(function(side, ch){   /* per-ear voice, used by the Count call */
    var g = ctx.createGain(); g.gain.value = S.guide.vol/100; g.connect(outMerger, 0, ch); guideSide[side] = g;
  });
  var v = window.GUIDE_VOICES || {};
  Object.keys(v).forEach(function(k){
    var bin = atob(v[k].split(',')[1]), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    guideLoad[k] = new Promise(function(res){
      ctx.decodeAudioData(arr.buffer, function(buf){ guideBuf[k]=buf; res(buf); }, function(){ res(null); });
    });
  });
}
var pendingCue=null;   /* {id, time, srcs:[]} waiting for the next bar */
var cueEvents=[];      /* visual events for calls, kept apart from the beat queue so lights never wait behind a call */
/* maxDur: cut the clip (with a short fade) so fast counts do not overlap */
function playBuf(b, time, maxDur, dest){
  dest = dest || guideGain;
  var s = ctx.createBufferSource(); s.buffer=b;
  var cut = maxDur && b.duration > maxDur;
  if(cut){
    var g = ctx.createGain(); var fade = Math.min(0.03, maxDur*0.4);
    g.gain.setValueAtTime(1, time); g.gain.setValueAtTime(1, time+maxDur-fade); g.gain.linearRampToValueAtTime(0, time+maxDur);
    s.connect(g); g.connect(dest);
  } else s.connect(dest);
  s.start(time);
  if(cut) s.stop(time+maxDur+0.01);   /* stop must come after start */
  return s;
}
function sayGuide(id, time, onSrc, maxDur, dest){
  if(!guideGain) return;
  if(guideBuf[id]){ var s=playBuf(guideBuf[id], time, maxDur, dest); if(onSrc) onSrc(s); return; }
  var p = guideLoad[id]; if(!p) return;
  p.then(function(b){ if(b && time > ctx.currentTime - 0.05){ var s=playBuf(b, Math.max(time, ctx.currentTime), maxDur, dest); if(onSrc) onSrc(s); } });
}
/* time of the next beat 1 that has not played yet */
function nextBarTime(){
  var n = beatsPerBar();
  return beatInBar===0 ? nextBeatTime : nextBeatTime + (n-beatInBar)*countLen();
}
function cancelCue(){
  cueEvents.length=0;
  if(!pendingCue) return;
  pendingCue.srcs.forEach(function(s){ try{ s.stop(); }catch(e){} });
  pendingCue=null;
}
/* MultiTracks style: name on 1 of the next bar, then "2, 3, 4" on the remaining counts, so the section lands on the 1 after */
function callSection(id){
  ensureAudio();
  if(!running){ sayGuide(id, ctx.currentTime+0.02); flashCue(id); return; }
  if(pendingCue && pendingCue.id===id){ cancelCue(); renderGuideStatus(); toast('Cancelled'); return; }   /* same button again = undo */
  cancelCue();
  var t = nextBarTime(), len = countLen(), pos = callPositions();
  var cue = {id:id, time:t, srcs:[]};
  pendingCue = cue;
  sayGuide(id, t, function(s){ cue.srcs.push(s); });
  if(S.guide.count) for(var i=1;i<pos.length;i++){
    sayGuide('n'+(i+1), t + pos[i]*len, function(s){ cue.srcs.push(s); }, len);
  }
  cueEvents.push({time:t, id:id});
  renderGuideStatus();
}
/* press-and-hold: call right away. Name on the next count, numbers on the rest of this bar, section lands on the next 1 */
function callSectionNow(id){
  ensureAudio();
  if(!running){ sayGuide(id, ctx.currentTime+0.02); flashCue(id); return; }
  cancelCue();
  var len = countLen(), n = beatsPerBar(), pos = callPositions(), maxIdx = pos[pos.length-1];
  var t = nextBeatTime, idx = beatInBar, now = ctx.currentTime;
  while(idx > 0 && t - len >= now + 0.03){ t -= len; idx--; }   /* earliest upcoming count in this bar */
  var cue = {id:id, time:t, srcs:[], now:true};
  pendingCue = cue;
  sayGuide(id, t, function(s){ cue.srcs.push(s); });
  if(S.guide.count) for(var i=idx+1; i<n && i<=maxIdx; i++) sayGuide('n'+(i+1), t + (i-idx)*len, function(s){ cue.srcs.push(s); }, len);
  cueEvents.push({time:t, id:id});
  renderGuideStatus();
}
/* Count button: one bar of spoken numbers, split per ear. An ear on 1/4 hears "1 2 3 4";
   an ear on 1/8 or 1/16 hears "1 and 2 and ...". Both ears count at the same time. */
function sideUsesAnd(side){
  if(S.sig==='6/8') return false;                     /* the six counts are already eighths */
  var s=S[side], o=S[side==='left'?'right':'left'];
  if(s.mute && !o.mute) s=o;                          /* a muted ear follows the ear that is still clicking */
  return s.note!=='q';
}
function callCount(now){
  ensureAudio();
  var len=countLen(), n=beatsPerBar(), t, idx=0, cue={id:'count', time:0, srcs:[], now:!!now};
  if(!running){ t=ctx.currentTime+0.06; }
  else {
    if(pendingCue && pendingCue.id==='count'){ cancelCue(); renderGuideStatus(); toast('Cancelled'); return; }
    cancelCue();
    if(now){ t=nextBeatTime; idx=beatInBar; while(idx>0 && t-len>=ctx.currentTime+0.03){ t-=len; idx--; } }
    else t=nextBarTime();
    cue.time=t; pendingCue=cue; cueEvents.push({time:t, id:'count'});
  }
  var push=function(s){ cue.srcs.push(s); };
  ['left','right'].forEach(function(side){
    var withAnd=sideUsesAnd(side), dest=guideSide[side];
    for(var i=idx;i<n;i++){
      var at=t+(i-idx)*len;
      sayGuide('n'+(i+1), at, push, withAnd ? len/2 : len, dest);
      if(withAnd) sayGuide('and', at+len/2, push, len/2, dest);
    }
  });
  if(running) renderGuideStatus(); else flashCue('count');
}
function flashCue(id){
  var bs=$('addSec').children;
  for(var i=0;i<bs.length;i++){ bs[i].classList.remove('pending'); bs[i].classList.toggle('fired', bs[i].dataset.id===id); }
  clearTimeout(flashCue.t); flashCue.t=setTimeout(function(){ for(var i=0;i<bs.length;i++) bs[i].classList.remove('fired'); }, 600);
}
function applyGuideVolume(){
  if(!guideGain) return;
  var t=ctx.currentTime;
  [guideGain, guideSide.left, guideSide.right].forEach(function(g){ if(g){ g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(S.guide.vol/100, t, 0.03); } });
}

/* ---------- scheduler ---------- */
function scheduleBeat(t, beat, bar){
  var beatLen = countLen();
  ['left','right'].forEach(function(side){
    var n = clicksPer(S[side].note, beat);
    for(var k=0;k<n;k++){
      var time = t + k*beatLen/n;
      var acc = accentOf(beat);
      var main = S.sig!=='6/8' || beat%3===0;               /* in 6/8 only counts 1 and 4 are real beats */
      var level = k>0 ? 2 : (acc===2 ? 0 : (main ? 1 : 2));  /* in-between counts click softly unless accented */
      if(!(k===0 && acc===0)) click(side,time,level);   /* silent beat: skip the beat click only */
      queue.push({time:time, side:side, beat:beat, k:k});
    }
  });
  queue.push({time:t, side:null, beat:beat, bar:bar, k:0});   /* always advance the lights, even on a count with no click */
  if(bar===-1 && S.guide.countIn && beat<6) sayGuide('n'+(beat+1), t, null, beatLen);   /* spoken count-in bar before bar 1 */
}
function scheduler(){
  while(nextBeatTime < ctx.currentTime + LOOKAHEAD){
    scheduleBeat(nextBeatTime, beatInBar, barIndex);
    nextBeatTime += countLen();
    beatInBar++;
    if(beatInBar>=beatsPerBar()){ beatInBar=0; barIndex++; }
  }
}
function start(){
  ensureAudio();
  running = true; queue.length = 0;
  beatInBar = 0; barIndex = S.guide.countIn ? -1 : 0; pendingCue = null;
  nextBeatTime = ctx.currentTime + 0.08;
  scheduler();
  timerId = setInterval(scheduler, INTERVAL);
  requestAnimationFrame(draw);
  keepAwake(); lockLandscape();
  $('startBtn').textContent='STOP'; $('startBtn').classList.add('running');
  renderGuideStatus(barIndex);
}
function stop(){
  running = false; clearInterval(timerId); queue.length = 0;
  $('startBtn').textContent='START'; $('startBtn').classList.remove('running');
  var ls=document.querySelectorAll('.light'); for(var i=0;i<ls.length;i++) ls[i].classList.remove('on');
  cancelCue();
  renderGuideStatus();
}

/* ---------- visuals ---------- */
var dots = { left:null, right:null };
function flash(el, cls){ el.classList.remove('on'); el.classList.remove('sub'); void el.offsetWidth; el.classList.add(cls); }
function draw(){
  if(!running) return;
  var now = ctx.currentTime;
  while(queue.length && queue[0].time <= now){
    var ev = queue.shift();
    if(ev.side) flash(dots[ev.side], ev.k===0 ? 'on' : 'sub');
    else { lightBeat(ev.beat); if(ev.beat===0 && (ev.bar===-1 || ev.bar===0)) renderGuideStatus(ev.bar); }
  }
  while(cueEvents.length && cueEvents[0].time <= now){
    var ce = cueEvents.shift();
    if(pendingCue && pendingCue.id===ce.id && Math.abs(pendingCue.time-ce.time)<0.001) pendingCue=null;
    flashCue(ce.id); renderGuideStatus();
  }
  requestAnimationFrame(draw);
}
function lightBeat(b){
  var ls=document.querySelectorAll('.light');
  for(var i=0;i<ls.length;i++) ls[i].classList.toggle('on', i===b);
}
function buildLights(){
  var box=$('lights'); box.innerHTML=''; box.classList.toggle('six', beatsPerBar()===6);
  for(var i=0;i<beatsPerBar();i++){
    (function(i){
      var d=document.createElement('button'); d.className='light a'+accentOf(i);
      d.setAttribute('aria-label','beat '+(i+1)+' accent');
      d.addEventListener('click', function(){
        var p=S.accents[S.sig]; p[i] = p[i]===2 ? 1 : (p[i]===1 ? 0 : 2);
        d.className = 'light a'+p[i] + (d.classList.contains('on')?' on':'');
        persist();
      });
      box.appendChild(d);
    })(i);
  }
}

/* ---------- wake lock ---------- */
var wakeLock=null;
function needAwake(){ return true; }   /* screen stays on the whole time the app is open */
function keepAwake(){
  if(!('wakeLock' in navigator) || wakeLock) return;
  navigator.wakeLock.request('screen').then(function(w){
    wakeLock=w;
    w.addEventListener('release', function(){ wakeLock=null; });   /* the phone can drop it; we re-ask below */
  }).catch(function(){});
}
function releaseWake(){ if(wakeLock){ wakeLock.release().catch(function(){}); wakeLock=null; } }
setInterval(function(){ if(needAwake() && !wakeLock && document.visibilityState==='visible') keepAwake(); }, 5000);
keepAwake();
['pointerdown','touchstart'].forEach(function(n){ document.addEventListener(n, function(){ if(!wakeLock) keepAwake(); }, {passive:true}); });   /* some phones only grant it after a touch */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && needAwake()){ if(ctx && ctx.state==='suspended') ctx.resume(); keepAwake(); }
});
/* installed app: prefer landscape when the phone allows it */
function lockLandscape(){ try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }catch(e){} }

/* ---------- bpm ---------- */
function setBpm(v, silent){
  v = Math.max(30, Math.min(300, Math.round(v)));
  S.bpm = v; $('bpmVal').textContent = v; $('bpmSlider').value = v;
  if(!silent) persist();
}
var taps=[];
function tap(){
  var now = performance.now();
  if(taps.length && now - taps[taps.length-1] > 2000) taps = [];
  taps.push(now); if(taps.length>8) taps.shift();
  if(taps.length>=2){
    var iv = (taps[taps.length-1]-taps[0])/(taps.length-1);
    setBpm(60000/iv);
  }
  var b=$('tapBtn'); b.classList.add('hit'); setTimeout(function(){ b.classList.remove('hit'); },80);
}
function holdRepeat(btn, fn){
  var t=null, r=null;
  var down=function(e){ e.preventDefault(); fn(); t=setTimeout(function(){ r=setInterval(fn,70); },450); };
  var up=function(){ clearTimeout(t); clearInterval(r); };
  btn.addEventListener('pointerdown',down);
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){ btn.addEventListener(n,up); });
}

/* ---------- sides ---------- */
function buildSubs(side){
  var box = $(side==='left'?'subsL':'subsR'); box.innerHTML='';
  NOTES.forEach(function(nt){
    var b=document.createElement('button'); b.dataset.n=nt.id; b.setAttribute('aria-label', nt.label+' note');
    var g=document.createElement('span'); g.className='g'; g.textContent=nt.glyph;
    var t=document.createElement('span'); t.className='t'; t.textContent=nt.label;
    b.appendChild(g); b.appendChild(t);
    b.addEventListener('click', function(){ S[side].note=nt.id; renderSubs(side); persist(); });
    box.appendChild(b);
  });
  renderSubs(side);
}
function renderSubs(side){
  var bs = $(side==='left'?'subsL':'subsR').children;
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('sel', bs[i].dataset.n===S[side].note);
}
function buildSounds(side){
  var cap = side==='left'?'L':'R', pop = $('snd'+cap), gear = $('gear'+cap);
  pop.innerHTML='';
  SOUNDS.forEach(function(sd){
    var b=document.createElement('button'); b.textContent=sd.label; b.dataset.s=sd.id;
    b.addEventListener('click', function(e){ e.stopPropagation(); S[side].sound=sd.id; renderSounds(side); persist(); if(!running) preview(side); closeSoundPops(); });
    pop.appendChild(b);
  });
  gear.addEventListener('click', function(e){ e.stopPropagation(); var open = pop.hidden; closeSoundPops(); if(open){ pop.hidden=false; gear.classList.add('open'); } });
  renderSounds(side);
}
function closeSoundPops(){ ['L','R'].forEach(function(c){ $('snd'+c).hidden=true; $('gear'+c).classList.remove('open'); }); }
document.addEventListener('click', closeSoundPops);

/* ---------- ambient pad (endless, generated live) ---------- */
var pad=null, padMaster=null;
function makeIR(sec){
  var len=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(2,len,ctx.sampleRate);
  for(var c=0;c<2;c++){ var d=b.getChannelData(c); for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
  return b;
}
function ensurePad(){
  if(padMaster) return;
  padMaster = ctx.createGain(); padMaster.gain.value = S.pad.vol/100;
  var comp = ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=4;
  var dry = ctx.createGain(); dry.gain.value=0.4;
  var rev = ctx.createConvolver(); rev.buffer = makeIR(6);
  var wet = ctx.createGain(); wet.gain.value=1.0;
  padMaster.connect(dry); dry.connect(comp);
  padMaster.connect(rev); rev.connect(wet); wet.connect(comp);
  comp.connect(ctx.destination);
}
function startPad(){
  ensureAudio(); ensurePad();
  if(pad) stopPad(pad);
  var now = ctx.currentTime;
  var root = 65.4064 * Math.pow(2, S.pad.key/12);            /* C2 based */
  var third = 4;                                              /* always major */
  /* warm pad voicing: [semitones, center wave, level]. Soft waves in the middle, glassy sines on top. */
  var notes = [
    [0,'triangle',0.5], [7,'triangle',0.45], [12,'triangle',0.75], [12+third,'triangle',0.4],
    [19,'triangle',0.6], [24,'sine',0.55], [24+third,'sine',0.3], [31,'sine',0.35], [36,'sine',0.22]
  ];
  var g = ctx.createGain(); g.gain.setValueAtTime(0.03, now); g.gain.exponentialRampToValueAtTime(1, now+1.0);   /* about a 1 s fade in */
  var lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1900; lp.Q.value=0.2;
  var lfo = ctx.createOscillator(); lfo.frequency.value=0.05;
  var lfoG = ctx.createGain(); lfoG.gain.value=450; lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start(now);
  var oscs=[lfo];
  var canPan = typeof ctx.createStereoPanner === 'function';
  /* slow stereo chorus between the filter and the output for that lush, moving quality */
  var chorusIn = ctx.createGain(); lp.connect(chorusIn);
  var dryC = ctx.createGain(); dryC.gain.value=0.6; chorusIn.connect(dryC); dryC.connect(g);
  [[0.021,0.23,0.0035,-0.7],[0.029,0.17,0.0045,0.7]].forEach(function(c){
    var d = ctx.createDelay(0.1); d.delayTime.value=c[0];
    var l = ctx.createOscillator(); l.frequency.value=c[1];
    var lg = ctx.createGain(); lg.gain.value=c[2]; l.connect(lg); lg.connect(d.delayTime); l.start(now); oscs.push(l);
    var dg = ctx.createGain(); dg.gain.value=0.5;
    chorusIn.connect(d); d.connect(dg);
    if(canPan){ var p=ctx.createStereoPanner(); p.pan.value=c[3]; dg.connect(p); p.connect(g); } else dg.connect(g);
  });
  g.connect(padMaster);
  notes.forEach(function(nt){
    var f = root*Math.pow(2, nt[0]/12);
    /* center voice: soft wave. side voices: quiet detuned saws for texture only */
    [[0,nt[1],0.07],[-6,'sawtooth',0.018],[6,'sawtooth',0.018]].forEach(function(v){
      var o = ctx.createOscillator(); o.type=v[1]; o.frequency.value=f; o.detune.value=v[0];
      var og = ctx.createGain(); og.gain.value = nt[2]*v[2];
      o.connect(og); og.connect(lp);
      o.start(now); oscs.push(o);
    });
  });
  var sub = ctx.createOscillator(); sub.type='sine'; sub.frequency.value=root;
  var sg = ctx.createGain(); sg.gain.value=0.05; sub.connect(sg); sg.connect(g); sub.start(now); oscs.push(sub);
  pad = {oscs:oscs, gain:g};
  keepAwake();
}
function stopPad(p){
  var t = ctx.currentTime;
  p.gain.gain.cancelScheduledValues(t);
  p.gain.gain.setValueAtTime(Math.max(p.gain.gain.value, 0.0001), t);
  p.gain.gain.exponentialRampToValueAtTime(0.0001, t+2.5);
  p.oscs.forEach(function(o){ try{ o.stop(t+2.6); }catch(e){} });
  if(pad===p) pad=null;
}
function setPadOn(on){
  S.pad.on = on;
  if(on) startPad(); else { if(pad) stopPad(pad); }
  renderPad(); persist();
}
function applyPadVolume(){ if(padMaster){ var t=ctx.currentTime; padMaster.gain.cancelScheduledValues(t); padMaster.gain.setTargetAtTime(S.pad.vol/100, t, 0.05); } }

function buildGuide(){

    b.addEventListener('pointerdown', function(e){ e.preventDefault(); held=false; clearTimeout(holdT); holdT=setTimeout(function(){ held=true; if(sc[0]==='count') callCount(true); else callSectionNow(sc[0]); }, 380); });
    var up=function(e){ clearTimeout(holdT); if(e.type==='pointerup' && !held){ if(sc[0]==='count') callCount(false); else callSection(sc[0]); } held=false; };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', function(){ clearTimeout(holdT); });

function saveSong(){

  if(!name){ toast('Type a song name first'); $('nameIn').focus(); return; }
  var list = loadSongs(), snap = snapshot(), found=false;
  for(var i=0;i<list.length;i++) if(list[i].name.toLowerCase()===name.toLowerCase()){ list[i]=Object.assign({},list[i],snap,{name:name}); found=true; }

  renderSongs(); persist(); toast(found?'Updated "'+name+'"':'Saved "'+name+'"');
}
function loadSong(sg){
  S.bpm=sg.bpm; S.sig=normSig(sg); S.accents=normAccents(sg.accents);
  S.left=normSide(sg.left,'q'); S.right=normSide(sg.right,'e');

/* ---------- share songs between phones by QR code (songs only, slots stay per phone) ---------- */
var SHARE_TAG='SM1.', SHARE_PAGE_BYTES=320;
function utf8enc(str){ return Array.prototype.slice.call(new TextEncoder().encode(str)); }
function utf8dec(bytes){ return new TextDecoder().decode(new Uint8Array(bytes)); }
function b64enc(bytes){ var bin=''; for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64dec(str){ var t=str.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; var bin=atob(t), out=[]; for(var i=0;i<bin.length;i++) out.push(bin.charCodeAt(i)); return out; }
function noteIx(n){ return n==='s' ? 2 : (n==='e' ? 1 : 0); }
function soundIx(id){ for(var i=0;i<SOUNDS.length;i++) if(SOUNDS[i].id===id) return i; return 0; }
function songToBytes(sg){
  var L=normSide(sg.left,'q'), R=normSide(sg.right,'e'), P=normPad(sg.pad), G=normGuide(sg.guide), A=normAccents(sg.accents);
  var sig=Math.max(0, SIGS.indexOf(normSig(sg)));
  var nm=Array.from(String(sg.name||'')), name=utf8enc(nm.join(''));
  while(name.length>255){ nm.pop(); name=utf8enc(nm.join('')); }   /* whole characters only */
  var bpm=Math.max(30, Math.min(300, Math.round(+sg.bpm)||120));
  var b=[name.length].concat(name);
  b.push(bpm>>8, bpm&255);
  b.push(sig | (noteIx(L.note)<<2) | (noteIx(R.note)<<4) | (L.mute?64:0) | (R.mute?128:0));
  b.push(soundIx(L.sound) | (soundIx(R.sound)<<2) | (P.on?16:0) | (G.count?32:0) | (G.countTo==='4'?64:0) | (G.countIn?128:0));
  b.push(P.key&15);
  b.push(L.vol&127, R.vol&127, P.vol&127, G.vol&127);
  var acc=A['3/4'].concat(A['4/4'], A['6/8']), packed=[0,0,0,0];
  for(var k=0;k<13;k++) packed[k>>2] |= (acc[k]&3) << ((k&3)*2);
  return b.concat(packed);
}
function bytesToSong(b, pos){
  var need=function(n){ if(pos+n>b.length) throw new Error('short'); };
  need(1); var nl=b[pos++]; need(nl+13);
  var name=utf8dec(b.slice(pos,pos+nl)).trim(); pos+=nl;
  if(!name) throw new Error('name');
  var bpm=(b[pos]<<8)|b[pos+1]; pos+=2;
  var f1=b[pos++], f2=b[pos++], key=b[pos++]&15;
  var vols=b.slice(pos,pos+4); pos+=4;
  var packed=b.slice(pos,pos+4); pos+=4;
  var acc=[]; for(var k=0;k<13;k++) acc.push(Math.min(2,(packed[k>>2]>>((k&3)*2))&3));
  var NT=['q','e','s'];
  var sg={ name:name, bpm:Math.max(30,Math.min(300,bpm)), sig:SIGS[f1&3]||'4/4', accV:2,
    accents:{ '3/4':acc.slice(0,3), '4/4':acc.slice(3,7), '6/8':acc.slice(7,13) },
    left:{ note:NT[(f1>>2)&3]||'q', mute:!!(f1&64), sound:(SOUNDS[f2&3]||SOUNDS[0]).id, vol:Math.min(100,vols[0]) },
    right:{ note:NT[(f1>>4)&3]||'e', mute:!!(f1&128), sound:(SOUNDS[(f2>>2)&3]||SOUNDS[0]).id, vol:Math.min(100,vols[1]) },
    pad:{ on:!!(f2&16), key:Math.min(11,key), mode:'major', vol:Math.min(100,vols[2]) },
    guide:{ vol:Math.min(100,vols[3]), count:!!(f2&32), countTo:(f2&64)?'4':'bar', countIn:!!(f2&128) } };
  sg.left=normSide(sg.left,'q'); sg.right=normSide(sg.right,'e'); sg.pad=normPad(sg.pad); sg.guide=normGuide(sg.guide); sg.accents=normAccents(sg.accents);
  return {song:sg, pos:pos};
}
/* pages: [{text, count}] ; every page is self-contained so they can be scanned in any order */
function encodePages(list, maxBytes){
  var chunks=list.map(songToBytes), pages=[], cur=[], curLen=0, curCount=0;
  var flush=function(){ if(curCount){ pages.push({bytes:cur, count:curCount}); cur=[]; curLen=0; curCount=0; } };
  chunks.forEach(function(c){ if(curCount && curLen+c.length>maxBytes) flush(); cur=cur.concat(c); curLen+=c.length; curCount++; });
  flush();
  if(!pages.length) pages.push({bytes:[], count:0});
  return pages.map(function(pg, i){ return { text: SHARE_TAG+b64enc([i+1, pages.length].concat(pg.bytes)), count:pg.count }; });
}
function decodePage(text){
  text=String(text||'').trim();
  if(text.indexOf(SHARE_TAG)!==0) return null;
  var b=b64dec(text.slice(SHARE_TAG.length));
  if(b.length<2) throw new Error('short');
  var idx=b[0], total=b[1], pos=2, songs=[];
  if(!idx || !total || idx>total) throw new Error('page');
  while(pos<b.length){ var r=bytesToSong(b,pos); songs.push(r.song); pos=r.pos; }
  return {idx:idx, total:total, songs:songs};
}
function mergeSongs(incoming){
  var list=loadSongs(), byName={}, seen={}, add=0, upd=0;
  list.forEach(function(sg,i){ byName[sg.name.toLowerCase()]=i; });
  incoming.forEach(function(sg){
    var k=sg.name.toLowerCase(); if(seen[k]) return; seen[k]=true;
    if(byName[k]!==undefined){ list[byName[k]]=Object.assign({}, sg, {name:list[byName[k]].name}); upd++; }
    else { list.push(sg); byName[k]=list.length-1; add++; }
  });
  return {list:list, add:add, upd:upd};
}
function importSongs(incoming){
  if(!incoming.length){ toast('No songs in that code'); return false; }
  var m=mergeSongs(incoming);
  var msg='Import '+incoming.length+' song'+(incoming.length===1?'':'s')+'?'+(m.upd ? ' ('+m.upd+' will replace songs with the same name)' : '');
  if(!confirm(msg)) return false;
  storeSongs(m.list); renderSongs(); renderSongModal();
  toast((m.add+m.upd)+' songs imported'); return true;
}

/* ---- Send: show the pages as QR codes ---- */
var share={pages:[], i:0, timer:null};
function drawQr(canvas, text, cssPx){
  var dpr=window.devicePixelRatio||1, qr=window.qrcode(0,'L'); qr.addData(text,'Byte'); qr.make();
  var n=qr.getModuleCount(), quiet=4, cell=Math.max(1, Math.floor(cssPx*dpr/(n+quiet*2))), size=cell*(n+quiet*2);
  canvas.width=size; canvas.height=size; canvas.style.width=canvas.style.height=Math.round(size/dpr)+'px';
  var c=canvas.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,size,size); c.fillStyle='#000';
  for(var r=0;r<n;r++) for(var col=0;col<n;col++) if(qr.isDark(r,col)) c.fillRect((col+quiet)*cell,(r+quiet)*cell,cell,cell);
  return n;
}
function openShare(){
  var list=loadSongs(); if(!list.length){ toast('No saved songs to send'); return; }
  share.pages=encodePages(list, SHARE_PAGE_BYTES); share.i=0;
  $('shareModal').hidden=false; $('shareTitle').textContent=list.length+' song'+(list.length===1?'':'s');
  $('shareQr').parentNode.classList.toggle('one', share.pages.length===1);
  renderShare();
  clearInterval(share.timer);
  if(share.pages.length>1) share.timer=setInterval(function(){ share.i=(share.i+1)%share.pages.length; renderShare(); }, 2500);
}
function renderShare(){
  var land=innerWidth>innerHeight && innerWidth>=640;
  var px=land ? innerHeight-60 : Math.min(innerWidth-60, innerHeight-230);
  drawQr($('shareQr'), share.pages[share.i].text, Math.max(120, px));
  $('sharePage').textContent = share.pages.length>1 ? 'code '+(share.i+1)+' of '+share.pages.length+'  (keeps turning)' : '';
}
function closeShare(){ clearInterval(share.timer); $('shareModal').hidden=true; }
function shareText(){ return encodePages(loadSongs(), 1e9)[0].text; }
function copyShare(){
  var t=shareText();
  var done=function(){ toast('Code copied. Paste it on the other phone.'); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function(){ prompt('Copy this code', t); });
  else prompt('Copy this code', t);
}

/* ---- Receive: camera scanner, with paste as the fallback ---- */
var scan={stream:null, raf:0, pages:{}, total:0, detector:null, busy:false, last:0, canvas:null};
function scanStatus(msg){ $('scanStatus').textContent=msg; }
function openScan(){
  $('scanModal').hidden=false; scan.pages={}; scan.total=0; scan.detector=null; scan.busy=false;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ scanStatus('No camera here. Use "paste code".'); return; }
  scanStatus('starting camera…');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false}).then(function(st){
    if($('scanModal').hidden){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
    scan.stream=st; var v=$('scanVideo'); v.srcObject=st; v.play().catch(function(){});
    if(window.BarcodeDetector){ try{ scan.detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){ scan.detector=null; } }
    scanStatus("point at the other phone's code");
    cancelAnimationFrame(scan.raf); scan.raf=requestAnimationFrame(scanTick);
  }, function(e){ scanStatus('Camera not available ('+(e && e.name || 'blocked')+'). Allow the camera in the phone settings, or use "paste code".'); });
}
function scanTick(){
  if($('scanModal').hidden) return;
  scan.raf=requestAnimationFrame(scanTick);
  var v=$('scanVideo'); if(v.readyState<2 || !v.videoWidth || scan.busy) return;
  var now=performance.now(); if(now-scan.last<120) return; scan.last=now;
  if(scan.detector){
    scan.busy=true;
    scan.detector.detect(v).then(function(codes){
      scan.busy=false; if($('scanModal').hidden) return;
      if(codes.length){ codes.forEach(function(c){ gotCode(c.rawValue); }); return; }
      jsqrFrame(v);   /* Android Chrome answers [] (never rejects) while its barcode module is missing, so try jsQR on the same frame */
    }, function(){ scan.busy=false; scan.detector=null; });
    return;
  }
  jsqrFrame(v);
}
function jsqrFrame(v){
  if(!window.jsQR) return;
  var k=Math.min(1, 800/Math.max(v.videoWidth, v.videoHeight));   /* keep the long side at 800 px, portrait or landscape */
  var cw=Math.round(v.videoWidth*k), ch=Math.round(v.videoHeight*k);
  var cv=scan.canvas || (scan.canvas=document.createElement('canvas'));
  if(cv.width!==cw || cv.height!==ch){ cv.width=cw; cv.height=ch; }
  var c=cv.getContext('2d', {willReadFrequently:true}); c.drawImage(v,0,0,cw,ch);
  var img=c.getImageData(0,0,cw,ch);
  var r=window.jsQR(img.data, cw, ch, {inversionAttempts:'dontInvert'});
  if(r && r.data) gotCode(r.data);
}
function gotCode(text){
  var pg;
  try{ pg=decodePage(text); }catch(e){ scanStatus('That code is damaged, try again'); return; }
  if(!pg){ scanStatus('That is not a Split Metronome code'); return; }
  if(scan.pages[pg.idx]) return;
  scan.pages[pg.idx]=pg.songs; scan.total=pg.total;
  if(navigator.vibrate) navigator.vibrate(40);
  var have=Object.keys(scan.pages).length;
  if(have<pg.total){ scanStatus('got code '+have+' of '+pg.total+', keep pointing'); return; }
  finishScan();
}
function finishScan(){
  var all=[]; for(var i=1;i<=scan.total;i++) all=all.concat(scan.pages[i]||[]);
  stopScan(); closeScan();
  importSongs(all);
}
function pasteCode(){
  var t=prompt('Paste the code from the other phone'); if(!t) return;
  var parts=t.split(/\s+/).filter(Boolean), pages={}, total=0, bad=false;
  parts.forEach(function(x){ try{ var pg=decodePage(x); if(pg){ pages[pg.idx]=pg.songs; total=pg.total; } else bad=true; }catch(e){ bad=true; } });
  var have=Object.keys(pages).length;
  if(!have){ scanStatus(bad ? 'That is not a Split Metronome code' : 'Nothing to import'); return; }
  if(have<total){ scanStatus('Only '+have+' of '+total+' codes pasted, paste the rest too'); return; }
  var all=[]; for(var i=1;i<=total;i++) all=all.concat(pages[i]||[]);
  stopScan(); closeScan(); importSongs(all);
}
function stopScan(){
  cancelAnimationFrame(scan.raf); scan.raf=0;
  if(scan.stream){ scan.stream.getTracks().forEach(function(t){ t.stop(); }); scan.stream=null; }
  var v=$('scanVideo'); try{ v.pause(); }catch(e){} v.srcObject=null;
}
function closeScan(){ stopScan(); $('scanModal').hidden=true; }
function buildShare(){
  $('songSend').addEventListener('click', openShare);
  $('songRecv').addEventListener('click', openScan);
  $('shareClose').addEventListener('click', closeShare);
  $('shareCopy').addEventListener('click', copyShare);
  $('sharePrev').addEventListener('click', function(){ share.i=(share.i-1+share.pages.length)%share.pages.length; renderShare(); });
  $('shareNext').addEventListener('click', function(){ share.i=(share.i+1)%share.pages.length; renderShare(); });
  $('scanClose').addEventListener('click', closeScan);
  $('scanPaste').addEventListener('click', pasteCode);
  window.addEventListener('resize', function(){ if(!$('shareModal').hidden) renderShare(); });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState!=='visible' && !$('scanModal').hidden) closeScan(); });
}

function openSongModal(){ renderSongModal(); $('songModal').hidden=false; }
function closeSongModal(){ $('songModal').hidden=true; }
function renderSongModal(){
  var box=$('songRows'); box.innerHTML='';
  var list=loadSongs().sort(function(a,b){ return a.name.localeCompare(b.name); }), slots=loadSlots();
  if(!list.length){ var e=document.createElement('div'); e.className='modalEmpty'; e.textContent='No saved songs yet. Set things up, then tap Save.'; box.appendChild(e); return; }
  list.forEach(function(sg){
    var row=document.createElement('div'); row.className='srow';
    var nm=document.createElement('button'); nm.className='sname'+(sg.name===songName?' cur':'');
    var b=document.createElement('b'); b.textContent=sg.name; var sm=document.createElement('small');
    sm.textContent=sg.bpm+' bpm  '+normSig(sg)+(sg.pad && sg.pad.on ? '  pad '+KEYS[normPad(sg.pad).key] : '');
    nm.appendChild(b); nm.appendChild(sm);
    nm.addEventListener('click', function(){ loadSong(sg); renderSongModal(); });
    var ss=document.createElement('div'); ss.className='sslots';
    for(var i=0;i<6;i++){
      (function(i){
        var sb=document.createElement('button'); sb.textContent=i+1; sb.classList.toggle('in', slots[i]===sg.name);
        sb.addEventListener('click', function(){
          var a=loadSlots();
          if(a[i]===sg.name){ a[i]=''; toast('Slot '+(i+1)+' cleared'); }
          else { a=a.map(function(n){ return n===sg.name ? '' : n; }); a[i]=sg.name; toast('Slot '+(i+1)+' = '+sg.name); }   /* one slot per song */
          storeSlots(a); renderSlots(); renderSongModal();
        });
        ss.appendChild(sb);
      })(i);
    }
    var del=document.createElement('button'); del.className='sdel'; del.innerHTML='&times;';
    del.addEventListener('click', function(){ deleteSong(sg.name); renderSongModal(); });
    row.appendChild(nm); row.appendChild(ss); row.appendChild(del); box.appendChild(row);
  });
}

function renderSongs(){
  var ul=$('songs'); ul.innerHTML='';
  var list=loadSongs().sort(function(a,b){ return a.name.localeCompare(b.name); });
  renderSlots();
  if(!list.length){ var e=document.createElement('div'); e.className='empty'; e.textContent='No saved songs yet'; ul.appendChild(e); return; }
  list.forEach(function(sg){
    var li=document.createElement('li'); if(sg.name===songName) li.classList.add('cur');
    var info=document.createElement('div'); info.className='info';
    var nm=document.createElement('div'); nm.className='nm'; nm.textContent=sg.name;
    var meta=document.createElement('div'); meta.className='meta';
    var sgSig=normSig(sg);
    meta.innerHTML='<b>'+sg.bpm+'</b> bpm &nbsp; <span class="l">L '+subLabel(sg.left)+'</span> &nbsp; <span class="r">R '+subLabel(sg.right)+'</span> &nbsp; '+sgSig+(sg.pad && sg.pad.on ? ' &nbsp; pad '+KEYS[normPad(sg.pad).key] : '');
    info.appendChild(nm); info.appendChild(meta);
    info.addEventListener('click', function(){ loadSong(sg); });
    var del=document.createElement('button'); del.className='del'; del.innerHTML='&times;'; del.setAttribute('aria-label','delete');
    del.addEventListener('click', function(){ deleteSong(sg.name); });
    li.appendChild(info); li.appendChild(del); ul.appendChild(li);
  });
}
function subLabel(s){ if(!s) return '?'; if(s.mute) return 'mute'; var n=normSide(s,'q').note; for(var i=0;i<NOTES.length;i++) if(NOTES[i].id===n) return NOTES[i].glyph; return '?'; }

/* ---------- persistence ---------- */
function persist(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify({S:S, songName:songName})); }catch(e){} applyVolumes(); }
function restore(){
  try{ var st=JSON.parse(localStorage.getItem(STATE_KEY)||'null'); if(st && st.S){ S=Object.assign(S, st.S); songName=st.songName||''; } }catch(e){}
  S.sig=normSig(S); delete S.beatsPerBar; delete S.accent;
  S.accents=normAccents(S.accents);
  if(!S.accV){ if(S.accents['6/8'].join()==='2,1,1,2,1,1') S.accents['6/8']=[2,1,1,1,1,1]; S.accV=2; }   /* one-time: old 6/8 default */
  S.left=normSide(S.left,'q'); S.right=normSide(S.right,'e');
  S.pad=normPad(S.pad); S.pad.on=false;   /* audio cannot autostart without a tap */
  S.guide=normGuide(S.guide);
}
function renderAll(){
  setBpm(S.bpm, true); renderSide('left'); renderSide('right');
  renderSig(); buildLights(); renderPad(); renderGuide();
  $('songName').textContent = songName || 'unsaved'; renderSongs();
}
var toastT=null;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },1300); }

/* ---------- wire up ---------- */
restore();
dots.left=$('dotL'); dots.right=$('dotR');
buildSubs('left'); buildSubs('right'); buildSounds('left'); buildSounds('right'); buildSig(); buildKeys(); buildGuide(); buildSlots(); buildShare();
renderAll();

holdRepeat($('bpmUp'), function(){ setBpm(S.bpm+1); });
holdRepeat($('bpmDown'), function(){ setBpm(S.bpm-1); });
$('bpmSlider').addEventListener('input', function(){ setBpm(this.value); });
$('tapBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); tap(); });
['left','right'].forEach(function(side){
  var cap=side==='left'?'L':'R';
  $('vol'+cap).addEventListener('input', function(){ S[side].vol=+this.value; $('vol'+cap+'v').textContent=this.value; persist(); });
  $('mute'+cap).addEventListener('click', function(){ S[side].mute=!S[side].mute; renderSide(side); persist(); });
});
$('startBtn').addEventListener('click', function(){ running ? stop() : start(); });
$('saveBtn').addEventListener('click', saveSong);
$('nameIn').addEventListener('keydown', function(e){ if(e.key==='Enter'){ saveSong(); this.blur(); } });
$('hdSave').addEventListener('click', function(){ var n=prompt('Song name', songName||''); if(n && n.trim()){ $('nameIn').value=Array.from(n.trim()).slice(0,40).join(''); saveSong(); } });
$('hdDel').addEventListener('click', function(){ if(songName) deleteSong(songName); else toast('No song loaded'); });
$('padVol').addEventListener('input', function(){ S.pad.vol=+this.value; $('padVolV').textContent=this.value; applyPadVolume(); persist(); });
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT' || e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); running?stop():start(); }
  else if(e.key==='t' || e.key==='T'){ tap(); }
  else if(e.key==='ArrowUp' || e.key==='ArrowRight'){ setBpm(S.bpm+1); }
  else if(e.key==='ArrowDown' || e.key==='ArrowLeft'){ setBpm(S.bpm-1); }
});

if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
